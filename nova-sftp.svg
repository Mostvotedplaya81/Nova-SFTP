<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dark premium background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="30%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    
    <!-- Glossy diagonal glass overlay -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Base Drop Shadow for the app icon -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    
    <!-- Ambient Star Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip Path to keep gloss perfectly inside the rounded square -->
    <clipPath id="squircleClip">
      <rect x="32" y="32" width="448" height="448" rx="100"/>
    </clipPath>
  </defs>

  <!-- App Icon Base (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGradient)" filter="url(#dropShadow)"/>
  
  <!-- Subtle 3D Inner Edge -->
  <rect x="34" y="34" width="444" height="444" rx="98" fill="none" stroke="#52525b" stroke-width="2" opacity="0.7"/>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="#000000" stroke-width="4"/>

  <!-- Background Ambient Glow (Blue top-left, Green bottom-right) -->
  <circle cx="216" cy="216" r="80" fill="#0ea5e9" filter="url(#glow)" opacity="0.4"/>
  <circle cx="296" cy="296" r="80" fill="#10b981" filter="url(#glow)" opacity="0.3"/>

  <!-- Diagonal Star Points (Pushed Back into shadow) -->
  <g filter="url(#glow)">
    <polygon points="256,256 220,180 120,120 180,220" fill="#0284c7"/> <!-- NW Blue -->
    <polygon points="256,256 292,180 392,120 332,220" fill="#1e3a8a"/> <!-- NE Dark Blue -->
    <polygon points="256,256 332,292 392,392 292,332" fill="#064e3b"/> <!-- SE Dark Green -->
    <polygon points="256,256 180,292 120,392 220,332" fill="#059669"/> <!-- SW Green -->
  </g>

  <!-- Main 4-Point Star (Faceted 3D Geometry) -->
  <g filter="url(#glow)">
    <!-- North Point (Top) -->
    <polygon points="256,256 256,60 236,240" fill="#67e8f9"/> <!-- Bright light cyan -->
    <polygon points="256,256 256,60 276,240" fill="#1d4ed8"/> <!-- Deep blue shadow -->
    
    <!-- East Point (Right) -->
    <polygon points="256,256 452,256 276,240" fill="#3b82f6"/> <!-- Medium blue -->
    <polygon points="256,256 452,256 276,272" fill="#047857"/> <!-- Dark green shadow -->
    
    <!-- South Point (Bottom) -->
    <polygon points="256,256 256,452 276,272" fill="#064e3b"/> <!-- Deep green shadow -->
    <polygon points="256,256 256,452 236,272" fill="#34d399"/> <!-- Bright light green -->
    
    <!-- West Point (Left) -->
    <polygon points="256,256 60,256 236,272" fill="#10b981"/> <!-- Medium green -->
    <polygon points="256,256 60,256 236,240" fill="#22d3ee"/> <!-- Cyan highlight -->
  </g>

  <!-- Central Highlight / Star Core -->
  <polygon points="256,230 266,256 256,282 246,256" fill="#ffffff" opacity="0.6" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff" opacity="0.9"/>

  <!-- Glassmorphism Gloss Overlay -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#gloss)" clip-path="url(#squircleClip)"/>

</svg>

